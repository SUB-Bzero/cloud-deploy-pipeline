# Local test stack: Web app + PostgreSQL.   Run:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    container_name: capstone-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./app
      args:
        APP_VERSION: local
    container_name: capstone-web
    environment:
      DATABASE_URL: postgresql://appuser:localpassword@db:5432/appdb
      ENABLE_FAULT_ENDPOINT: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
